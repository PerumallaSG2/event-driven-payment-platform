# ===============================
# Server
# ===============================
server.port=8082
spring.application.name=payment-processor

# ===============================
# Database (PostgreSQL via infra/docker-compose.yml, host port 5434, database "processor")
# ===============================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/processor
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASSWORD:app}

# Keep a timestamp's original UTC offset when reading payment.initiated: fraud-detection gets it unchanged.
spring.jackson.datatype.datetime.adjust-dates-to-context-time-zone=false

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks the entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ===============================
# Kafka (KRaft via infra/docker-compose.yml, host port 9095)
# payment.initiated + ledger.events + payment.reviews in; ledger.commands + payment.events out (through the outbox)
# ===============================
spring.kafka.bootstrap-servers=${KAFKA_HOST:localhost}:${KAFKA_PORT:9095}
spring.kafka.consumer.auto-offset-reset=earliest
# Topics come from the services' NewTopic beans (3 partitions). A consumer that auto-created one would get the
# broker default of 1 partition; adding partitions later re-maps keys and breaks per-payment ordering.
spring.kafka.consumer.properties.allow.auto.create.topics=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Only OutboxRelay and the dead-letter recoverer produce; payloads are JSON strings.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Fail fast while Kafka is down: the relay retries later, and the rows stay in the outbox meanwhile.
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000

# ===============================
# Transactional outbox
# ===============================
messaging.outbox.poll-interval=PT0.2S
messaging.outbox.batch-size=100
messaging.outbox.send-timeout=PT15S
messaging.outbox.retention=P7D
messaging.outbox.cleanup-interval=PT24H

# ===============================
# Saga
# ===============================
# A saga waiting this long for the ledger gets its current command sent again (the ledger is idempotent by paymentId).
saga.resend-after=PT30S
# A saga still waiting for its hold this long after it started is compensated: ReleaseHold, then FAILED.
# A saga waiting for its capture is never compensated: the capture was decided, so it is re-sent until it lands.
saga.hold-deadline=PT5M
saga.sweep-interval=PT5S
saga.sweep-batch-size=100
# A payment fraud-detection sent to REVIEW keeps its hold this long; with no decision by then the hold is released
# and the payment FAILS (REVIEW_TIMEOUT).
saga.review-deadline=PT24H
# A fraud check unfinished this long was interrupted (the app stopped mid-check): fail closed, release the hold.
# Must be well above fraud.timeout. The check is not repeated, so fraud-detection never sees a transaction twice.
saga.fraud-check-stale-after=PT1M

# ===============================
# Fraud check (fraud-detection, ~/projects/fraud-detection, :8080)
# POST /api/transactions -> 202, then GET /api/transactions/{id} -> 404 until scored. No decision within
# fraud.timeout (down, slow, unreadable) means fail closed: the hold is released and the payment FAILS.
# ===============================
fraud.base-url=${FRAUD_URL:http://localhost:8080}
fraud.connect-timeout=PT1S
fraud.read-timeout=PT2S
fraud.timeout=PT5S
fraud.poll-interval=PT0.2S
fraud.submit-attempts=3

# ===============================
# Reconciliation (ledger-service asks GET /internal/reconciliation/stuck-sagas)
# ===============================
# A saga counts as stuck this long after the sweep should have moved it on (HOLD_REQUESTED/PENDING_REVIEW past
# deadline_at, FRAUD_CHECK past saga.fraud-check-stale-after).
reconciliation.grace=PT1M
# A capture or release sent this many times (every saga.resend-after) without an answer counts as stuck.
reconciliation.stuck-after-attempts=10
