# ===============================
# Server
# ===============================
server.port=8081
spring.application.name=payment-api

# ===============================
# Database (PostgreSQL via infra/docker-compose.yml, host port 5434)
# ===============================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/payments
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASSWORD:app}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks the entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# ===============================
# Kafka (KRaft via infra/docker-compose.yml, host port 9095)
# ===============================
spring.kafka.bootstrap-servers=${KAFKA_HOST:localhost}:${KAFKA_PORT:9095}
# Only OutboxRelay produces; the payload is the JSON already stored in the outbox row.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Fail fast while Kafka is down: the relay retries later, and the rows stay in the outbox meanwhile.
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000

# ===============================
# Transactional outbox
# ===============================
messaging.outbox.poll-interval=PT0.2S
messaging.outbox.batch-size=100
messaging.outbox.send-timeout=PT15S
messaging.outbox.retention=P7D
messaging.outbox.cleanup-interval=PT24H

# ===============================
# Jackson
# ===============================
# Keep the offset of incoming OffsetDateTime values (Jackson's default converts them to UTC): the payment's
# timestamp goes to fraud-detection unchanged, and its odd-hours rule reads the local time.
spring.jackson.datatype.datetime.adjust-dates-to-context-time-zone=false

# ===============================
# Idempotency-Key
# ===============================
# A key is remembered for 24 h from first use. After that it is forgotten and the same key creates a NEW payment
# (the old one stays and can still be fetched with GET /payments/{id}), so clients must retry within 24 h.
payments.idempotency.ttl=PT24H
# An IN_PROGRESS claim older than this counts as crashed and the same request may take it over.
payments.idempotency.lock-timeout=PT30S
# Deleting expired keys only keeps the table small; expired rows are already treated as absent.
payments.idempotency.cleanup-interval=PT1H
