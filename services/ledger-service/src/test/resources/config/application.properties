# Test-only overrides. Spring Boot loads classpath:/config/application.properties on top of the main
# classpath:/application.properties (it doesn't replace it), so only these keys change.

# No scheduled reconciliation in tests: a run started on its own would write reports into whatever a test class is
# doing. Tests that need a run call Reconciliation.run() or POST /reconciliation/runs.
reconciliation.enabled=false
