# ===============================
# Server
# ===============================
server.port=8083
spring.application.name=ledger-service

# ===============================
# Database (PostgreSQL via infra/docker-compose.yml, host port 5434, database "ledger")
# ===============================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/ledger
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASSWORD:app}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks the entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ===============================
# Kafka (KRaft via infra/docker-compose.yml, host port 9095): ledger.commands in, ledger.events out
# ===============================
spring.kafka.bootstrap-servers=${KAFKA_HOST:localhost}:${KAFKA_PORT:9095}
spring.kafka.consumer.auto-offset-reset=earliest
# Topics come from the services' NewTopic beans (3 partitions). A consumer that auto-created one would get the
# broker default of 1 partition; adding partitions later re-maps keys and breaks per-payment ordering.
spring.kafka.consumer.properties.allow.auto.create.topics=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Only OutboxRelay and the dead-letter recoverer produce; payloads are JSON strings.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Fail fast while Kafka is down: the relay retries later, and the rows stay in the outbox meanwhile.
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000

# ===============================
# Transactional outbox
# ===============================
messaging.outbox.poll-interval=PT0.2S
messaging.outbox.batch-size=100
messaging.outbox.send-timeout=PT15S
messaging.outbox.retention=P7D
messaging.outbox.cleanup-interval=PT24H
