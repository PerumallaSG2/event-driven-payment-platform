# ===============================
# Server
# ===============================
server.port=8083
spring.application.name=ledger-service

# ===============================
# Database (PostgreSQL via infra/docker-compose.yml, host port 5434, database "ledger")
# ===============================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/ledger
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASSWORD:app}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks the entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
