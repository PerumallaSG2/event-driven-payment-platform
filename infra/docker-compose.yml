# Local infra for the payment platform. Host ports avoid ~/projects/fraud-detection (Postgres 5433, Redis 6380,
# Kafka 9094, app 8080, Prometheus 9091, Grafana 3001), so both stacks can run at once.
#   docker compose -f infra/docker-compose.yml up -d --wait
services:
  postgres:
    image: postgres:16-alpine
    container_name: payment-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: payments
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - payment-pgdata:/var/lib/postgresql/data
      # One database per service. Runs only when the volume is empty; on an older volume run once:
      #   docker exec payment-postgres createdb -U app ledger
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d payments"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One KRaft node, broker and controller in one (no ZooKeeper); same image as fraud-detection and the tests.
  # No volume: topics and offsets are gone after `docker compose down`.
  kafka:
    image: apache/kafka:3.9.2
    container_name: payment-kafka
    ports:
      - "${KAFKA_PORT:-9095}:9095"
    environment:
      CLUSTER_ID: cGF5bWVudC1wbGF0Zm9ybQ   # any base64-encoded 16 bytes; fixed so restarts keep the same cluster
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9095
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9095}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx256m -Xms256m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: payment-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8085}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

volumes:
  payment-pgdata:
